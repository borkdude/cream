name: Build cream

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            platform: linux
            ext: ""
            graalvm_asset: graalvm-jdk-25e1-25.0.3-ea.28_linux-x64_bin.tar.gz
          - os: macos-latest
            arch: aarch64
            platform: macos
            ext: ""
            graalvm_asset: graalvm-jdk-25e1-25.0.3-ea.28_macos-aarch64_bin.tar.gz
          - os: windows-latest
            arch: amd64
            platform: windows
            ext: ".exe"
            graalvm_asset: graalvm-jdk-25e1-25.0.3-ea.28_windows-x64_bin.zip

    runs-on: ${{ matrix.os }}

    env:
      GRAALVM_EA_TAG: jdk-25e1-25.0.3-ea.28

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GraalVM EA28 (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/graalvm"
          curl -L --fail -o "$RUNNER_TEMP/graalvm.tar.gz" \
            "https://github.com/graalvm/oracle-graalvm-ea-builds/releases/download/${GRAALVM_EA_TAG}/${{ matrix.graalvm_asset }}"
          tar -xzf "$RUNNER_TEMP/graalvm.tar.gz" -C "$RUNNER_TEMP/graalvm" --strip-components=1
          # macOS tarball has Contents/Home structure
          if [ -d "$RUNNER_TEMP/graalvm/Contents/Home" ]; then
            echo "JAVA_HOME=$RUNNER_TEMP/graalvm/Contents/Home" >> "$GITHUB_ENV"
            echo "$RUNNER_TEMP/graalvm/Contents/Home/bin" >> "$GITHUB_PATH"
          else
            echo "JAVA_HOME=$RUNNER_TEMP/graalvm" >> "$GITHUB_ENV"
            echo "$RUNNER_TEMP/graalvm/bin" >> "$GITHUB_PATH"
          fi

      - name: Download GraalVM EA28 (windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/graalvm"
          curl -L --fail -o "$RUNNER_TEMP/graalvm.zip" \
            "https://github.com/graalvm/oracle-graalvm-ea-builds/releases/download/${GRAALVM_EA_TAG}/${{ matrix.graalvm_asset }}"
          7z x "$RUNNER_TEMP/graalvm.zip" -o"$RUNNER_TEMP/graalvm" >/dev/null
          # zip has single top-level dir
          home=$(find "$RUNNER_TEMP/graalvm" -maxdepth 1 -mindepth 1 -type d | head -n1)
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"

      - name: Verify GraalVM version
        shell: bash
        run: |
          echo "Using GRAALVM_EA_TAG=$GRAALVM_EA_TAG"
          java -version

      - name: Clone and install Clojure fork
        shell: bash
        run: |
          git clone -b crema --depth 1 https://github.com/borkdude/clojure.git /tmp/clojure-fork
          cd /tmp/clojure-fork
          mvn install -Dmaven.test.skip=true -q

      - name: Install Clojure tools
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      - name: Set up MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native binary
        shell: bash
        run: bb bb/build_native.clj
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}

      - name: Package binary (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: tar czf cream-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz cream

      - name: Package binary (windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: 7z a cream-${{ matrix.platform }}-${{ matrix.arch }}.zip cream.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cream-${{ matrix.platform }}-${{ matrix.arch }}
          path: cream-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.platform == 'windows' && 'zip' || 'tar.gz' }}

      - name: Run library tests
        shell: bash
        run: bb run-lib-tests

  release:
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create or update dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build
          prerelease: true
          make_latest: false
          files: |
            cream-linux-amd64.tar.gz
            cream-macos-aarch64.tar.gz
            cream-windows-amd64.zip
          body: |
            Rolling development build of cream (Clojure + Crema).

            ```sh
            tar xzf cream-<platform>-<arch>.tar.gz
            ./cream -M -e '(+ 1 2 3)'
            ```
